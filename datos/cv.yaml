resumen: >-
  Senior machine learning engineer y technical lead con más de 5 años en datos y ML, actualmente en
  la división de analítica de Grupo Coppel (CENIC), con experiencia en retail y banca (BanCoppel).
  Construye y opera soluciones de IA generativa en producción: sistemas RAG agénticos, bases
  vectoriales en Google Cloud, fine-tuning, integración con MCP y evaluación sistemática de calidad.
  Es responsable de la arquitectura, los estándares y la práctica de MLOps/LLMOps que llevan los
  modelos de la experimentación a sistemas productivos confiables. Ha impartido RAG y LLMOps en la
  Facultad de Ciencias de la UNAM.

