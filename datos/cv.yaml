    de experimentación extensa para decidir cuándo conviene frente a prompting.

  - >-
    Bases vectoriales en Google Cloud para sistemas RAG en producción.

  - >-
    Integración de herramientas y fuentes de datos con Model Context Protocol (MCP).
  - >-
    Evaluación de sistemas RAG con métricas de retrieval (Hit Rate@5, MRR, Precision@5) y de
    generación (fidelidad y relevancia).
  - >-
    Observabilidad de aplicaciones con LLMs usando LangSmith, Langfuse y Cloud Logging.
  - >-
    Versionado de datos con DVC, seguimiento de experimentos con MLflow y orquestación con Cloud
    Composer y Vertex AI Pipelines; infraestructura como código con Terraform, Docker y CI/CD.

